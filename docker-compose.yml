x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nikelpower}
  POSTGRES_USER: ${POSTGRES_USER:-nikelpower}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-postgres-password}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nikelpower}:${POSTGRES_PASSWORD:-localdev-postgres-password}@postgres:5432/${POSTGRES_DB:-nikelpower}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdev-neo4j-password}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/1

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nikelpower}
      POSTGRES_USER: ${POSTGRES_USER:-nikelpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-postgres-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')"
          | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-localdev-neo4j-password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-localdev-neo4j-password}" "RETURN 1" > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev-redis-password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  neo4j-schema:
    image: neo4j:5.26-community
    profiles:
      - schema
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdev-neo4j-password}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        cypher-shell -a bolt://neo4j:7687
        -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD"
        --file /schema/001-ontology.cypher
        && cypher-shell -a bolt://neo4j:7687
        -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD"
        --file /schema/002-verify-ontology.cypher
    volumes:
      - ./docker/neo4j:/schema:ro
    networks:
      - nikelpower

networks:
  nikelpower:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
