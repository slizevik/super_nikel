x-backend-environment: &backend-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-nikelpower}
  POSTGRES_USER: ${POSTGRES_USER:-nikelpower}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-postgres-password}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nikelpower}:${POSTGRES_PASSWORD:-localdev-postgres-password}@postgres:5432/${POSTGRES_DB:-nikelpower}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdev-neo4j-password}
  NEO4J_HEAP: ${NEO4J_HEAP:-2G}
  NEO4J_PAGECACHE: ${NEO4J_PAGECACHE:-2G}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_URL: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-localdev-redis-password}@redis:6379/1
  LLM_PROVIDER: ${LLM_PROVIDER:-yandex}
  YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-}
  YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
  YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-yandexgpt/latest}
  YANDEX_EMBEDDING_MODEL: ${YANDEX_EMBEDDING_MODEL:-emb/latest}
  YANDEX_CLOUD_BASE_URL: ${YANDEX_CLOUD_BASE_URL:-https://ai.api.cloud.yandex.net/v1}
  YANDEX_VISION_MODEL: ${YANDEX_VISION_MODEL:-}
  TOKEN_LIMIT: ${TOKEN_LIMIT:-1000000}
  LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-120}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-256}
  EMBEDDING_SIMILARITY_THRESHOLD: ${EMBEDDING_SIMILARITY_THRESHOLD:-0.82}
  DICTIONARY_CONTEXT_TOP_K: ${DICTIONARY_CONTEXT_TOP_K:-15}
  ENTITY_MIN_OCCURRENCES: ${ENTITY_MIN_OCCURRENCES:-2}
  DOCUMENTS_DIR: ${DOCUMENTS_DIR:-./data/documents}
  INGESTION_STATE_DIR: ${INGESTION_STATE_DIR:-./data/ingestion}
  CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-850}
  CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-1000}
  CHUNK_OVERLAP_PARAGRAPHS: ${CHUNK_OVERLAP_PARAGRAPHS:-1}
  INGESTION_BATCH_SIZE: ${INGESTION_BATCH_SIZE:-10}
  GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-nikelpower}
  LIBREOFFICE_BINARY: ${LIBREOFFICE_BINARY:-libreoffice}
  LIBREOFFICE_TIMEOUT_SEC: ${LIBREOFFICE_TIMEOUT_SEC:-180}
  CONVERTED_PDF_DIR: ${CONVERTED_PDF_DIR:-./data/ingestion/converted}
  ANALYZE_DOCUMENT_IMAGES: ${ANALYZE_DOCUMENT_IMAGES:-true}
  LOG_DIR: /app/logs
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
  LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}

x-rotating-logging: &rotating-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nikelpower}
      POSTGRES_USER: ${POSTGRES_USER:-nikelpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev-postgres-password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')"
          | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-localdev-neo4j-password}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-localdev-neo4j-password}" "RETURN 1" > /dev/null
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev-redis-password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nikelpower
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  backend:
    logging: *rotating-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      CORS_ORIGINS: '["http://localhost:5173"]'
    command:
      - /bin/sh
      - -c
      - alembic -c /app/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs
    networks:
      - nikelpower
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    logging: *rotating-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-environment
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
    volumes:
      - docling_cache:/root/.cache
      - ./logs:/app/logs
    command:
      - celery
      - -A
      - app.worker:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --hostname=worker@%h
    networks:
      - nikelpower
    depends_on:
      backend:
        condition: service_healthy

  neo4j-schema:
    image: neo4j:5.26-community
    profiles:
      - schema
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localdev-neo4j-password}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        cypher-shell -a bolt://neo4j:7687
        -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD"
        --file /schema/001-ontology.cypher
        && cypher-shell -a bolt://neo4j:7687
        -u "$$NEO4J_USER" -p "$$NEO4J_PASSWORD"
        --file /schema/002-verify-ontology.cypher
    volumes:
      - ./docker/neo4j:/schema:ro
    networks:
      - nikelpower

networks:
  nikelpower:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  docling_cache:
